name: Secure DevOps Pipeline

on:
  push:
    branches:
      - main

jobs: 
  build:
    # 🔧 SELF-HOSTED RUNNER for localhost access
    # If using GitHub-hosted runner, change this to: runs-on: ubuntu-latest
    # For DefectDojo on localhost:8000, must use self-hosted runner
    #runs-on: ubuntu-latest
    runs-on: self-hosted 

    steps:
      # 📥 CHECKOUT
      - name: Checkout code
        uses: actions/checkout@v4.1.7
        with:
          persist-credentials: false

      # 🔐 GITLEAKS
      - name: Run Gitleaks
        continue-on-error: true
        run: |
          docker run --rm -v $PWD:/repo zricethezav/gitleaks:latest detect \
          --source=/repo \
          --no-git \
          --exit-code 1
      # 🔐 TRUFFLEHOG
      - name: Run TruffleHog
        continue-on-error: true
        run: |
          docker run --rm -v $PWD:/repo ghcr.io/trufflesecurity/trufflehog:latest \
          filesystem /repo --fail --no-update
      # ☕ JAVA
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'


      # 📦 BUILD
      - name: Build JAR
        run: |
          cd app
          mvn clean install -DskipTests -Dcheckstyle.skip=true -Dspring-javaformat.skip=true
      # 🐳 DOCKER LOGIN
      - name: Docker Login
        uses: docker/login-action@v3.3.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 🐳 BUILD IMAGE
      - name: Build Docker Image
        run: docker build -t anoop1605/devops-app -f docker/Dockerfile .

      # 🐳 PUSH IMAGE with improved retry logic
      - name: Push Docker Image
        run: |
          MAX_RETRIES=5
          TIMEOUT=120
          for i in $(seq 1 $MAX_RETRIES); do
            echo "Push attempt $i/$MAX_RETRIES..."
            timeout $TIMEOUT docker push anoop1605/devops-app && echo "✅ Push successful!" && exit 0
            if [ $i -lt $MAX_RETRIES ]; then
              WAIT=$((10 * i))
              echo "⏳ Push failed. Waiting ${WAIT}s before retry..."
              sleep $WAIT
            fi
          done
          echo "❌ Push failed after $MAX_RETRIES attempts"
          exit 1

      # ️ TRIVY SCAN (UPDATED → JSON + non-blocking)
      - name: Scan Docker Image with Trivy
        continue-on-error: true
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:latest image \
            --format json \
            --output /root/.cache/trivy-report.json \
            --exit-code 0 \
            --severity CRITICAL,HIGH \
            --ignore-unfixed \
            --vuln-type os,library \
            --scanners vuln \
            --skip-dirs /var/log,/tmp,/var/cache \
            --timeout 30m \
            anoop1605/devops-app

      # ⚙️ 1. CONFIGURE RUNNER MEMORY FOR ELASTICSEARCH
      - name: Set system parameters for SonarQube
        run: sudo sysctl -w vm.max_map_count=262144

      # 🐳 2. START SONARQUBE CONTAINER
      - name: Start SonarQube Container
        run: |
          docker run -d --name sonarqube \
            -p 9000:9000 \
            -e SONAR_ES_BOOTSTRAP_CHECKS_DISABLE=true \
            sonarqube:community

      # ⏳ 3. WAIT FOR SONARQUBE
      - name: Wait for SonarQube
        run: |
          echo "Waiting for SonarQube..."
          MAX_ATTEMPTS=60
          READY=false
          for i in $(seq 1 $MAX_ATTEMPTS); do
            # Verify the container hasn't crashed
            if [ "$(docker inspect -f '{{.State.Running}}' sonarqube 2>/dev/null)" != "true" ]; then
              echo "❌ SonarQube container exited unexpectedly! Dumping logs:"
              docker logs sonarqube --tail 50
              exit 1
            fi

            # Check status endpoint
            if curl -s -f http://127.0.0.1:9000/api/system/status | grep -q '"status":"UP"'; then
              echo "✅ SonarQube is ready!"
              READY=true
              break
            fi

            echo "Still starting... (Attempt $i/$MAX_ATTEMPTS)"
            sleep 5
          done

          if [ "$READY" = "false" ]; then
            echo "❌ SonarQube failed to start in time! Container logs:"
            docker logs sonarqube --tail 50
            exit 1
          fi

      # 🔑 4. CREATE PROJECT & GENERATE ANALYSIS TOKEN ON THE FLY
      - name: Setup SonarQube Project and Token
        run: |
          # Wait a few seconds for DB schema creation to settle
          sleep 10
          
          # Create project
          curl -s -u admin:admin -X POST "http://127.0.0.1:9000/api/projects/create?name=secure-devops&project=secure-devops" || true
          
          # Generate a dedicated runner token
          TOKEN_RESPONSE=$(curl -s -u admin:admin -X POST "http://127.0.0.1:9000/api/user_tokens/generate?name=ci-token")
          SONAR_TOKEN=$(echo "$TOKEN_RESPONSE" | jq -r '.token // empty')
          
          # Fallback to default admin credentials if token API isn't needed
          if [ -z "$SONAR_TOKEN" ]; then
            echo "Failed to generate token, using basic auth"
            echo "SONAR_AUTH=-Dsonar.login=admin -Dsonar.password=admin" >> $GITHUB_ENV
          else
            echo "SONAR_TOKEN=$SONAR_TOKEN" >> $GITHUB_ENV
            echo "SONAR_AUTH=-Dsonar.login=$SONAR_TOKEN" >> $GITHUB_ENV
          fi

      # 🔍 5. RUN SONARQUBE SCAN
      - name: SonarQube Scan
        run: |
          cd app
          mvn org.sonarsource.scanner.maven:sonar-maven-plugin:4.0.0.4121:sonar \
            -Dsonar.projectKey=secure-devops \
            -Dsonar.host.url=http://127.0.0.1:9000 \
            $SONAR_AUTH

      # ✅ 6. QUALITY GATE
      - name: Check SonarQube Quality Gate
        run: |
          echo "Checking Quality Gate..."
          # Give the compute engine a moment to process the analysis report
          sleep 15
          
          AUTH_HEADER="admin:admin"
          if [ -n "$SONAR_TOKEN" ]; then
            AUTH_HEADER="${SONAR_TOKEN}:"
          fi

          STATUS=$(curl -s -u "$AUTH_HEADER" \
            "http://127.0.0.1:9000/api/qualitygates/project_status?projectKey=secure-devops" \
            | jq -r '.projectStatus.status')

          echo "Quality Gate Status: $STATUS"
          if [ "$STATUS" != "OK" ]; then
            echo "❌ Quality Gate Failed: $STATUS"
            exit 1
          else
            echo "✅ Quality Gate Passed"
          fi

      # 💾 CACHE NVD DATA FOR DEPENDENCY-CHECK
      - name: Cache NVD Data
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/owasp/dependency-check-data
          key: ${{ runner.os }}-nvd-data-${{ steps.date.outputs.date }}
          restore-keys: |
            ${{ runner.os }}-nvd-data-


      # ️ OWASP DEPENDENCY CHECK (Using persistent local storage)
      - name: OWASP Dependency Check
        run: |
          cd app
          mvn org.owasp:dependency-check-maven:check \
            -DnvdApiKey=${{ secrets.NVD_API_KEY }} \
            -DnvdApiDelay=2000

      # 🛡️ CHECKOV SCAN
      - name: Run Checkov Scan
        continue-on-error: true
        run: |
          docker run --rm -v ${{ github.workspace }}:/app bridgecrewio/checkov:latest \
            --framework kubernetes,dockerfile,github_actions \
            --directory /app \
            --output cli \
            --output json \
            --skip-framework helm \
            --output-file-path /app/checkov-report.json 2>&1 | tee checkov.log || true

      - name: Ingest Findings into DefectDojo
        env:
          DEFECTDOJO_URL: ${{ secrets.DEFECTDOJO_URL }}
          DEFECTDOJO_TOKEN: ${{ secrets.DEFECTDOJO_TOKEN }}
        run: |
          chmod +x scripts/defectdojo-upload.sh
          ./scripts/defectdojo-upload.sh
