name: Secure DevOps Pipeline

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  DEFECTDOJO_URL: ${{ secrets.DEFECTDOJO_URL || 'http://localhost:8000' }}
  DEFECTDOJO_TOKEN: ${{ secrets.DEFECTDOJO_TOKEN }}
  DEFECTDOJO_PRODUCT_NAME: "Secure DevOps Pipeline"
  DEFECTDOJO_ENGAGEMENT_NAME: "CI/CD Automated Scan"

jobs:
  # =========================================================================
  # STAGE 1–4: PARALLEL STATIC SECURITY & CODE QUALITY CHECKS
  # =========================================================================
  secret-scan:
    name: "Stage 1: Secret Detection"
    runs-on: self-hosted
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks Scan
        run: |
          echo "[+] Running Secret Scanning via Gitleaks..."
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:latest detect \
            --source="/repo" \
            --report-format=json \
            --report-path=/repo/gitleaks-report.json \
            --verbose || true

      - name: Upload Secret Report
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: gitleaks-report.json
          if-no-files-found: ignore

  sast-scan:
    name: "Stage 2: SAST (SonarQube)"
    runs-on: self-hosted
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Ensure SonarQube Container Is Running
        run: |
          sudo sysctl -w vm.max_map_count=262144 || true
          if docker ps --format '{{.Names}}' | grep -Eq '^sonarqube$'; then
            echo "[✓] SonarQube container is already running. Reusing existing instance."
          else
            echo "[+] Starting fresh SonarQube container..."
            docker rm -f sonarqube 2>/dev/null || true
            docker run -d --name sonarqube \
              -p 9000:9000 \
              -e SONAR_ES_BOOTSTRAP_CHECKS_DISABLE=true \
              sonarqube:community
          fi

      - name: Fast Health Check for SonarQube
        run: |
          echo "[+] Waiting for SonarQube API..."
          for i in {1..30}; do
            if curl -s -f http://127.0.0.1:9000/api/system/status | grep -q '"status":"UP"'; then
              echo "[✓] SonarQube is UP!"
              break
            fi
            sleep 3
          done

      - name: Execute SonarQube Scan
        run: |
          cd app
          # Create project if not exists
          curl -s -u admin:admin -X POST "http://127.0.0.1:9000/api/projects/create?name=secure-devops&project=secure-devops" || true
          
          # Generate or reuse token
          TOKEN=$(curl -s -u admin:admin -X POST "http://127.0.0.1:9000/api/user_tokens/generate?name=ci-$RANDOM" | jq -r '.token // empty')
          AUTH_PARAM="-Dsonar.login=admin -Dsonar.password=admin"
          if [ -n "$TOKEN" ]; then
            AUTH_PARAM="-Dsonar.login=$TOKEN"
          fi

          mvn org.sonarsource.scanner.maven:sonar-maven-plugin:4.0.0.4121:sonar \
            -Dsonar.projectKey=secure-devops \
            -Dsonar.host.url=http://127.0.0.1:9000 \
            $AUTH_PARAM

  sca-scan:
    name: "Stage 3: SCA Dependency Scan (Trivy)"
    runs-on: self-hosted
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Resolve Maven Dependencies Locally
        run: |
          cd app
          # Pre-populates ~/.m2 cache so Trivy does not hit Maven Central
          mvn dependency:resolve -DskipTests || true

      - name: Run Offline-Aware Trivy Filesystem Scan
        run: |
          echo "[+] Scanning dependencies using local Maven cache..."
          docker run --rm \
            -v "$HOME/.m2:/root/.m2" \
            -v "$PWD:/root/src" \
            aquasec/trivy:latest fs \
            --skip-version-check \
            --offline-scan \
            --format json \
            --output /root/src/trivy-sca-results.json \
            --severity HIGH,CRITICAL \
            /root/src/app

      - name: Upload SCA Report
        uses: actions/upload-artifact@v4
        with:
          name: trivy-sca-results
          path: trivy-sca-results.json
          if-no-files-found: ignore

  iac-scan:
    name: "Stage 4: IaC & Policy Scan (Checkov & OPA)"
    runs-on: self-hosted
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Checkov IaC Scan
        run: |
          docker run --rm -v "$PWD:/repo" bridgecrew/checkov:latest \
            -d /repo/k8s \
            --framework kubernetes \
            --output json \
            --output-file-path /repo/checkov-report.json || true
          # Move output to root if generated inside a subdirectory
          [ -f checkov-report.json/results_json.json ] && mv checkov-report.json/results_json.json checkov-results.json || true
          [ -f checkov-report.json ] && mv checkov-report.json checkov-results.json || true

      - name: Evaluate OPA Rego Policies
        run: |
          echo "[+] Validating Kubernetes manifests against Rego policies..."
          docker run --rm -v "$PWD:/work" openpolicyagent/conftest:latest test \
            -p /work/policy \
            /work/k8s/deployment.yaml || true

      - name: Upload IaC Report
        uses: actions/upload-artifact@v4
        with:
          name: checkov-results
          path: checkov-results.json
          if-no-files-found: ignore

      # Place it here at the end of the job:
      - name: Fix Workspace Permissions
        if: always()
        run: sudo chown -R $(id -u):$(id -g) "$GITHUB_WORKSPACE"

  # =========================================================================
  # STAGE 5: CONTAINER BUILD & IMAGE HARDENING
  # =========================================================================
  build-and-harden:
    name: "Stage 5: Container Build & Image Scan"
    needs: [secret-scan, sca-scan, iac-scan]
    runs-on: self-hosted
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Application Jar
        run: |
          cd app
          mvn clean package -DskipTests

      - name: Build Local Container Image
        run: |
          docker build -t petclinic:latest .

      - name: Scan Image with Grype
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$PWD:/reports" anchore/grype:latest \
            docker:petclinic:latest \
            -o json > grype-results.json || true

      - name: Upload Container Scan Report
        uses: actions/upload-artifact@v4
        with:
          name: grype-results
          path: grype-results.json
          if-no-files-found: ignore

  # =========================================================================
  # STAGE 6: DAST (OWASP ZAP)
  # =========================================================================
  dast-scan:
    name: "Stage 6: DAST (OWASP ZAP)"
    needs: [build-and-harden]
    runs-on: self-hosted
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Test Application Container
        run: |
          docker rm -f petclinic-app || true
          docker run -d --name petclinic-app -p 8081:8080 petclinic:latest
          
          # Health check waiting for Spring Boot application startup
          for i in {1..20}; do
            if curl -s http://127.0.0.1:8081/ > /dev/null; then
              echo "[✓] Spring PetClinic app is healthy on port 8081!"
              break
            fi
            sleep 3
          done

      - name: Run Bounded OWASP ZAP Baseline Scan (Max 3 Mins)
        run: |
          mkdir -p zap-out
          chmod 777 zap-out
          # -m 3 limits spider crawler to 3 minutes, avoiding infinite crawl cycles
          docker run --rm --network="host" \
            -v "$PWD/zap-out:/zap/wrk/:rw" \
            ghcr.io/zaproxy/zaproxy:stable zap-baseline.py \
            -t http://127.0.0.1:8081/ \
            -m 3 \
            -J zap-results.json || true

      - name: Clean Up Test Application
        if: always()
        run: docker rm -f petclinic-app || true

      - name: Upload ZAP Report
        uses: actions/upload-artifact@v4
        with:
          name: zap-results
          path: zap-out/zap-results.json
          if-no-files-found: ignore

  # =========================================================================
  # STAGE 7: UNIFIED DEFECTDOJO INGESTION & METRICS
  # =========================================================================
  upload-findings:
    name: "Stage 7: DefectDojo Aggregation"
    needs: [secret-scan, sast-scan, sca-scan, iac-scan, build-and-harden, dast-scan]
    if: always()
    runs-on: self-hosted
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download All Security Reports
        uses: actions/download-artifact@v4
        with:
          path: reports/
          merge-multiple: true

      - name: Ingest Findings to Local DefectDojo
        env:
          DEFECTDOJO_URL: ${{ secrets.DEFECTDOJO_URL || 'http://localhost:8000' }}
          DEFECTDOJO_TOKEN: ${{ secrets.DEFECTDOJO_TOKEN }}
        run: |
          chmod +x scripts/*.sh
          cd reports/
          ls -la
          
          # Pass reports directory to upload script
          ../scripts/defectdojo-upload.sh .